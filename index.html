<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Felipe Uliana — Software Engineer | External Client Verification</title>
  <meta name="description" content="Senior Frontend Engineer & Web Architect portfolio designed for external client verification. High-performance, semantic HTML5, clean ES2026 JavaScript, WCAG 2.2 AA accessibility, and 90-100 Lighthouse benchmark targets.">
  <meta name="theme-color" content="#1e1e24">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="./fonts/FiraSans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/FiraSans-700.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Favicons and Web App Manifest -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="Felipe Uliana — Software Engineer">
  <meta property="og:description" content="Portfolio of senior web projects architected for external client verification. performance, WCAG 2.2 AA compliance, and clean code.">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-shadow-grey text-ghost-white font-sans antialiased selection:bg-amber-earth selection:text-shadow-grey min-h-screen flex flex-col">

  <!-- Accessible Skip Link for Keyboard Navigation (WCAG AA) -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-bubble-gum-pink focus:text-ghost-white focus:font-bold focus:rounded-lg focus:shadow-2xl focus:ring-2 focus:ring-ghost-white focus:outline-none"
  >
    Skip to main content
  </a>

  <!-- Mount Point for Single Page Application -->
  <div id="app" class="flex flex-col min-h-screen">
    <div id="header-shell" class="h-[91px]" aria-hidden="true"></div>
    <main id="main-content" class="flex-1" aria-labelledby="hero-title">
      <section class="relative overflow-hidden pt-12 pb-20 sm:pt-20 sm:pb-28" aria-label="Portfolio introduction">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <h1 id="hero-title" class="text-4xl sm:text-5xl font-bold font-sans tracking-tight text-ghost-white leading-tight">
            Engineering <span class="text-amber-earth">resilient web experiences</span> with performance.
          </h1>
        </div>
      </section>
    </main>
  </div>

  <!-- Main JavaScript Application Module (ES2026) -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
